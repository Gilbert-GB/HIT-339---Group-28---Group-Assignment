<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" role="img" aria-labelledby="libTitle">
  <title id="libTitle">Illustration of a library shelf with books, a record and toy blocks</title>

  <!-- soft background -->
  <circle cx="130" cy="110" r="100" fill="#e8f1fc"/>
  <circle cx="58" cy="52" r="4" fill="#93c5fd"/>
  <circle cx="212" cy="66" r="3" fill="#93c5fd"/>
  <circle cx="200" cy="44" r="5" fill="#bfdbfe"/>

  <!-- shelf -->
  <rect x="40" y="150" width="180" height="10" rx="3" fill="#07355f"/>
  <rect x="50" y="160" width="8" height="28" rx="2" fill="#07355f"/>
  <rect x="202" y="160" width="8" height="28" rx="2" fill="#07355f"/>

  <!-- books -->
  <rect x="56" y="78" width="20" height="72" rx="3" fill="#0066cc"/>
  <rect x="60" y="88" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  <rect x="60" y="136" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>

  <rect x="78" y="92" width="16" height="58" rx="3" fill="#93c5fd"/>
  <rect x="81" y="100" width="10" height="3" rx="1.5" fill="#0b4da0" opacity="0.6"/>

  <rect x="96" y="68" width="22" height="82" rx="3" fill="#0b4da0"/>
  <rect x="100" y="78" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  <rect x="100" y="84" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  <rect x="100" y="136" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>

  <rect x="120" y="98" width="14" height="52" rx="3" fill="#60a5fa"/>

  <!-- leaning book -->
  <g transform="rotate(12 147 150)">
    <rect x="138" y="86" width="18" height="64" rx="3" fill="#0b61d6"/>
    <rect x="142" y="96" width="10" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- record (music) -->
  <circle cx="184" cy="132" r="18" fill="#0f1724"/>
  <circle cx="184" cy="132" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="184" cy="132" r="6" fill="#93c5fd"/>
  <circle cx="184" cy="132" r="1.8" fill="#0f1724"/>

  <!-- toy blocks -->
  <rect x="204" y="132" width="16" height="18" rx="2" fill="#fbbf24"/>
  <rect x="206" y="116" width="13" height="16" rx="2" fill="#34d399"/>
</svg>